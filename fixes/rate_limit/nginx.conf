events {}

http {

    # Define rate limiting policy:
    #   * Identifies clients by IP address ($binary_remote_address)
    #   * Capped at 5 req per sec, with 10MB shared to track clients

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    upstream victim { 
        server victim:9000;
    }

    server {
        listen 9000;
        
        location / {
            limit_req zone=api_limit burst=10 nodelay; # Temporary burst
            limit_req_status 429;

            proxy_pass http://victim;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}