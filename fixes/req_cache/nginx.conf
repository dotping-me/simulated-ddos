events {}

http {
	# Creates table to store cache and sets rules (size, memory allocated and time to live)
	proxy_cache_path /var/cache/nginx keys_zone=my_cache:10m max_size=1g inactive=60m;
	limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

	upstream victim { server victim:9000; }

	server {
		listen 9000;
		
		# Forwards cache to victim using table 'my_cache' and tracks each requests
		location / {
			limit_req zone=api_limit burst=10 nodelay; # Temporary burst
            limit_req_status 429;

			proxy_cache my_cache;
			proxy_pass http://victim;

			# track HIT/MISS requests
			add_header X-Cache-Status $upstream_cache_status;

			proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}
	}
}
